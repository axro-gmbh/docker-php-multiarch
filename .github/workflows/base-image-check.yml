name: Base image check

# Rebuilds every image variant whose official php base image has changed since our last build.
# Scheduled workflows only run on the default branch, so this file lives there and
# dispatches docker-publish.yml on the variant branches.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { branch: 8.3-fpm-alpine-symfony, base: 'php:8.3-fpm-alpine' }
          - { branch: 8.4-fpm-alpine-symfony, base: 'php:8.4-fpm-alpine' }
          - { branch: 8.4-fpm-alpine-pimcore, base: 'php:8.4-fpm-alpine' }
          - { branch: 8.5-fpm-alpine-symfony, base: 'php:8.5-fpm-alpine' }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository }}:${{ matrix.branch }}
    steps:
      # Our image is stale when its bottom layers are no longer the current base layers
      - name: Compare base layers
        id: compare
        run: |
          layers() {
            docker buildx imagetools inspect "$1" --format '{{json (index .Image "linux/amd64").RootFS.DiffIDs}}'
          }
          BASE="$(layers '${{ matrix.base }}')"
          OURS="$(layers "$IMAGE")"
          STALE="$(jq -n --argjson b "$BASE" --argjson o "$OURS" '$o[:($b|length)] != $b')"
          echo "${{ matrix.branch }}: stale=$STALE"
          echo "stale=$STALE" >> "$GITHUB_OUTPUT"

      - name: Trigger rebuild
        if: steps.compare.outputs.stale == 'true'
        run: gh workflow run docker-publish.yml -R "${{ github.repository }}" --ref "${{ matrix.branch }}"

  # GitHub disables scheduled workflows in public repos after 60 days without activity.
  # Re-enabling the workflow resets that timer.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/base-image-check.yml/enable"
